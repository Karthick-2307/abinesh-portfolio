<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Abinesh Karthick K</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .notfound-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .notfound-msg {
      font-size: 1.25rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="notfound-wrapper">
    <div class="notfound-code gradient-text">404</div>
    <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
    <p class="notfound-msg">The page or resource you are looking for doesn't exist or has been relocated.</p>
    <a href="index.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Portfolio Home</span>
    </a>
  </div>
</body>
</html>
